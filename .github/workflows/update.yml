name: update

on:
  schedule:
    - cron: "0 6,18 * * *"   # 06:00 and 18:00 UTC
  workflow_dispatch:

permissions: {}   # default deny; the job grants only what it needs

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python scripts/fetch.py
      - run: python scripts/normalize.py
      - name: commit if changed
        run: |
          git config user.name "cbn-rates bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet -- data/rates.csv data/nfem.csv data/latest.json data/anomalies.csv && echo "no change" && exit 0
          git commit -m "chore(data): update to $(python -c 'import json;print(json.load(open("data/meta.json"))["last_date"])')"
          git push
